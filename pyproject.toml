[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chalktalk"
version = "0.3.0"
description = "Design, script, and print American football plays — playbook as code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
keywords = [
    "football", "playbook", "play-designer", "sports", "coaching",
    "practice-script", "call-sheet", "svg", "diagram",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "pydantic>=2.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
chalk = "chalktalk.cli:main"
chalktalk = "chalktalk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chalktalk*"]

[tool.setuptools.package-data]
chalktalk = ["designer/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
