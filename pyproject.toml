[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chalktalk"
dynamic = ["version"]
description = "Football plays and playbooks in Python, with a designer that runs in your browser"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Baker Thompson" }]
keywords = [
    "football", "playbook", "play designer", "coaching", "call sheet",
    "practice script", "wristband", "game plan", "diagram", "svg",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pydantic>=2.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "build", "twine"]

[project.urls]
Homepage = "https://github.com/matthewbakerthompson/chalktalk"
Documentation = "https://github.com/matthewbakerthompson/chalktalk#readme"
Changelog = "https://github.com/matthewbakerthompson/chalktalk/blob/main/CHANGELOG.md"
Issues = "https://github.com/matthewbakerthompson/chalktalk/issues"

[project.scripts]
chalk = "chalktalk.cli:main"
chalktalk = "chalktalk.cli:main"

[tool.setuptools.dynamic]
version = { attr = "chalktalk.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["chalktalk*"]

[tool.setuptools.package-data]
chalktalk = ["designer/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
