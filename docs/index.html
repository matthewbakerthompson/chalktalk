/* ─── bench ─────────────────────────────────────────────────────────────── */
function renderBench(){
  const box = $("playerList"); box.innerHTML = "";
  for (const a of assignments()){
    const p = a.player;
    const b = document.createElement("button"); b.type = "button";
    b.className = "tok" + (p.label === sel ? " sel" : "") + (OL.has(p.position) ? " ol" : "");
    b.title = [`${p.label} · ${playerKind(p)}`, `x ${fmt(p.x)}, y ${fmt(p.y)}`,
               a.motion_type ? `${a.motion_type} motion` : null,
               a.is_ball_carrier ? "ball carrier" : null].filter(Boolean).join(" · ");
    const ball = a.is_ball_carrier || p.position === "QB";
    b.innerHTML = `<span class="c${ball ? " ball" : ""}${a.motion_type ? " mo" : ""}">${esc(p.label)}</span>`
                + `<span class="a">${esc(assignmentSummary(a))}</span>`;
    b.onclick = () => { sel = p.label; selDef = null; selWp = -1; renderAll(); };
    box.appendChild(b);
  }
  if (play.defense){
    const sep = document.createElement("div"); sep.className = "tok-sep"; box.appendChild(sep);
    for (const d of play.defense.players){
      const b = document.createElement("button"); b.type = "button";
      b.className = "tok def" + (d.label === selDef ? " sel" : "");
      b.title = `${d.label} · ${d.position} · x ${fmt(d.x)}, y ${fmt(d.y)}`;
      b.innerHTML = `<span class="c">${esc(d.label)}</span><span class="a">${esc(defenderSummary(d))}</span>`;
      b.onclick = () => { selDef = d.label; sel = null; selWp = -1; renderAll(); };
      box.appendChild(b);
    }
  }
  const on = box.querySelector(".tok.sel");
  if (on && on.scrollIntoView) on.scrollIntoView({block:"nearest", inline:"nearest"});
}

/* ─── inspector strip ───────────────────────────────────────────────────── */
let lastInspKey = null;
function inspectorEnter(box, key){
  // Animate only when the thing being inspected changes, not on every drag tick.
  box.classList.toggle("insp-in", key !== lastInspKey);
  lastInspKey = key;
}
const bind = (id, ev, fn) => { const n = $(id); if (n) n[ev] = fn; };

function renderDefenderInspector(box, d){
  const call = d.assignment || {};
  inspectorEnter(box, "def:" + d.label);
  box.innerHTML = `
    <div class="ihead">
      <div class="top"><span class="glyph def"></span><span class="who">${esc(d.label)}</span>
        <span class="what">${esc(d.position)} · defense</span></div>
      <div class="tip">Drag him on the field, or set the job here</div>
    </div>
    <div class="ifield"><label for="dX">X</label><input id="dX" class="w56" type="number" step="0.5" value="${d.x}"></div>
    <div class="ifield"><label for="dY">Y</label><input id="dY" class="w56" type="number" step="0.5" value="${d.y}"></div>
    <div class="isep"></div>
    <div class="ifield"><label for="defRole">Role</label><select id="defRole" class="w104"></select></div>
    <div class="ifield"><label for="defZone">Zone</label><select id="defZone" class="w130"></select></div>
    <div class="ifield"><label for="defCovers">Covers</label><select id="defCovers" class="w104"></select></div>
    <div class="ifield"><label for="defSide">Side</label><input id="defSide" class="w56" type="number" step="0.1" value="${call.side ?? 1}"></div>
    <div class="ifield"><label for="defGap">Gap</label><input id="defGap" class="w56" value="${esc(call.gap ?? "")}" placeholder="A" autocomplete="off"></div>
    <div class="isep"></div>
    <div class="ifield"><label>&nbsp;</label><div class="btns"><button id="defClear" class="danger">Clear assignment</button></div></div>`;

  const ensure = () => (d.assignment = d.assignment ||
    {role:"zone", zone:null, side:1, covers:null, gap:null, path:[], note:null});

  fillSelect($("defRole"), CATALOG.def_roles.map(r => [r, words(r)]), call.role, "No role");
  $("defRole").onchange = e => {
    pushUndo();
    if (!e.target.value){ d.assignment = null; }
    else { ensure().role = e.target.value; }
    renderAll();
  };
  fillSelect($("defZone"),
    Object.entries(CATALOG.zones).map(([k, z]) => [k, z.name]), call.zone, "No zone");
  $("defZone").onchange = e => {
    pushUndo(); ensure().zone = e.target.value || null;
    if (e.target.value) d.assignment.role = "zone";
    renderAll();
  };
  fillSelect($("defCovers"),
    eligibleReceivers().map(p => [p.label, p.label]), call.covers, "Nobody");
  $("defCovers").onchange = e => {
    pushUndo(); ensure().covers = e.target.value || null;
    if (e.target.value){ d.assignment.role = "man"; d.assignment.zone = null; }
    renderAll();
  };
  $("dX").onchange = e => { pushUndo(); d.x = +e.target.value; renderAll(); };
  $("dY").onchange = e => { pushUndo(); d.y = +e.target.value; renderAll(); };
  $("defSide").onchange = e => { ensure().side = +e.target.value; renderAll(); };
  $("defGap").onchange = e => { ensure().gap = e.target.value || null; renderAll(); };
  $("defClear").onclick = () => { pushUndo(); d.assignment = null; renderAll(); };
}

function renderInspector(){
  const box = $("inspector");
  if (selDef && play.defense){
    const d = play.defense.players.find(p => p.label === selDef);
    if (d) return renderDefenderInspector(box, d);
  }
  const a = selA();
  if (!a){
    inspectorEnter(box, "none");
    box.innerHTML = `<div class="empty">
      <div><span class="lead">Nothing selected.</span>Pick a player on the field or on the bench.</div>
      <div class="legend"><b>Click</b> the field to add a route point · <b>Drag</b> a player, or a yellow handle
        · <b>Double-click</b> a handle to delete it · <b>Arrows</b> nudge, <kbd>Shift</kbd> for a yard
        · <kbd>F</kbd> flips · <kbd>Ctrl</kbd>+<kbd>K</kbd> commands</div></div>`;
    return;
  }
  const p = a.player, kind = playerKind(p);
  const isOL = kind === "lineman", isQB = kind === "quarterback";
  const drawing = !!(a.route && a.route.route_type !== "block");
  inspectorEnter(box, "off:" + p.label);
  const what = p.position !== p.label ? `${esc(p.position)} · ${kind}` : kind;
  const tip = drawing ? "Click the field to extend the route · drag a handle to bend it"
            : isOL   ? "Pick a block here, or click the field to pull him"
                     : "Click the field to start a route";
  box.innerHTML = `
    <div class="ihead">
      <div class="top"><span class="glyph"></span><span class="who">${esc(p.label)}</span><span class="what">${what}</span></div>
      <div class="tip">${tip}</div>
    </div>
    <div class="ifield"><label for="pX">X</label><input id="pX" class="w56" type="number" step="0.5" value="${p.x}"></div>
    <div class="ifield"><label for="pY">Y</label><input id="pY" class="w56" type="number" step="0.5" value="${p.y}"></div>
    <div class="isep"></div>
    <div class="ifield"><label for="routeSel">Route</label><select id="routeSel" class="w140"></select></div>
    <div class="ifield"><label for="blockSel">Block</label><select id="blockSel" class="w130"></select></div>
    ${a.block ? `
    <div class="ifield"><label for="blockTarget">Target</label><input id="blockTarget" class="w72"
      value="${esc(a.block.target || "")}" placeholder="3T" autocomplete="off"></div>
    <div class="ifield"><label for="blockDir">Direction</label><select id="blockDir" class="w72">
      <option value="1">Right</option><option value="-1">Left</option></select></div>` : ""}
    ${(!isOL && !isQB) ? `
    <div class="ifield"><label for="motionSel">Motion</label><select id="motionSel" class="w104"></select></div>` : ""}
    <div class="isep"></div>
    <div class="ifield"><label>&nbsp;</label><div class="btns">
      <button id="btnBc" class="${a.is_ball_carrier ? "on" : ""}" title="Give this player the ball">Ball carrier</button>
      ${a.block ? "" : `<button id="btnBlock" title="Base block, route cleared">Block</button>`}
      ${(a.route || a.block) ? `<button id="btnClearRoute" class="danger" title="Clear the route and the block">Clear</button>` : ""}
    </div></div>
    <div class="ifield grow"><label for="pNote">Note</label><input id="pNote" value="${esc(a.note ?? "")}"
      placeholder="Coaching point" autocomplete="off"></div>
    ${drawing ? `<div class="ifield"><label>Waypoints</label><div class="wps" id="wpList"></div></div>` : ""}`;

  fillSelect($("routeSel"),
    Object.keys(CATALOG.routes).map(k => [k, words(k)]),
    null, a.route ? `${words(a.route.route_type)} (current)` : "No route");
  $("routeSel").onchange = e => {
    if (!e.target.value) return;
    pushUndo();
    a.route = clone(CATALOG.routes[e.target.value]);
    a.block = null;                       // a player blocks or runs, not both
    selWp = -1; renderAll();
  };
  fillSelect($("blockSel"),
    Object.keys(CATALOG.blocks).map(k => [k, words(k)]),
    null, a.block ? `${words(a.block.kind)} (current)` : "Not blocking");
  $("blockSel").onchange = e => {
    if (!e.target.value) return;
    pushUndo();
    a.block = clone(CATALOG.blocks[e.target.value][String(blockDir)]);
    a.route = null;                       // a player blocks or runs, not both
    renderAll();
  };
  if (a.block){
    $("blockDir").value = String(blockDir);
    $("blockDir").onchange = e => {
      blockDir = +e.target.value;
      const kind = Object.keys(CATALOG.blocks).find(
        k => CATALOG.blocks[k]["1"].kind === a.block.kind);
      if (kind){
        pushUndo();
        const target = a.block.target, partner = a.block.combo_with;
        a.block = clone(CATALOG.blocks[kind][String(blockDir)]);
        a.block.target = target; a.block.combo_with = partner;
      }
      renderAll();
    };
    $("blockTarget").onchange = e => { a.block.target = e.target.value || null; renderAll(); };
  }
  if ($("motionSel")){
    fillSelect($("motionSel"), CATALOG.motions.map(m => [m, m]), a.motion_type, "No motion");
    $("motionSel").onchange = e => applyMotion(p.label, e.target.value || null);
  }
  $("pX").onchange = e => { pushUndo(); p.x = +e.target.value; syncFormation(); renderAll(); };
  $("pY").onchange = e => { pushUndo(); p.y = +e.target.value; syncFormation(); renderAll(); };
  $("pNote").onchange = e => { a.note = e.target.value || null; save(); };
  $("btnBc").onclick = () => {
    pushUndo();
    const on = !a.is_ball_carrier;
    assignments().forEach(x => x.is_ball_carrier = false);
    a.is_ball_carrier = on; renderAll();
  };
  bind("btnBlock", "onclick", () => {
    pushUndo();
    a.block = clone(CATALOG.blocks.BASE[String(blockDir)]);
    a.route = null;
    renderAll();
  });
  bind("btnClearRoute", "onclick", () => {
    pushUndo(); a.route = null; a.block = null; selWp = -1; renderAll();
  });

  const wl = $("wpList");
  if (wl){
    a.route.waypoints.forEach((w, i) => {
      const [ax, ay] = wpAbs(p, w);
      const b = document.createElement("button"); b.type = "button";
      b.className = "wp" + (i === selWp ? " sel" : "");
      b.title = `Waypoint ${i + 1}: x ${fmt(ax)}, y ${fmt(ay)}`;
      b.textContent = i + 1;
      b.onclick = () => { selWp = i; renderAll(); };
      wl.appendChild(b);
      if (i === selWp){
        const xy = document.createElement("span");
        xy.className = "wpxy"; xy.textContent = `${fmt(ax)}, ${fmt(ay)}`;
        wl.appendChild(xy);
        const del = document.createElement("button"); del.type = "button";
        del.className = "wpdel"; del.textContent = "×"; del.title = "Delete this waypoint";
        del.onclick = () => {
          pushUndo(); a.route.waypoints.splice(i, 1);
          if (a.route.waypoints.length < 2) a.route = null;
          selWp = -1; renderAll();
        };
        wl.appendChild(del);
      }
    });
  }
}

/* ─── play sheet ────────────────────────────────────────────────────────── */
function renderReads(){
  const box = $("readList");
  if (!box) return;
  box.innerHTML = "";
  const a = qbAssignment();
  const plan = a && a.qb;
  if (!plan){
    box.innerHTML = '<p class="note" style="margin:0">Give him a plan first.</p>';
    return;
  }
  for (const p of eligibleReceivers()){
    const order = plan.reads.indexOf(p.label);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (order >= 0 ? " sel" : "");
    b.title = order >= 0 ? `Read ${order + 1} · click to drop` : "Add to the progression";
    b.innerHTML = order >= 0
      ? `<span class="n">${order + 1}</span>${esc(p.label)}`
      : esc(p.label);
    b.onclick = () => {
      pushUndo();
      plan.reads = order >= 0
        ? plan.reads.filter(l => l !== p.label)   // click again to drop him
        : [...plan.reads, p.label];
      renderAll();
    };
    box.appendChild(b);
  }
}

function renderTitle(){
  $("playName").value = play.name || "";
  $("formationName").value = play.formation.name || "";
  $("formationName").style.width = Math.min(30, Math.max(9, (play.formation.name || "").length + 1)) + "ch";
  $("personnel").value = play.formation.personnel || "";
  setSeg($("playTypeSeg"), play.play_type);
  document.title = (play.name ? play.name + " · " : "") + "Chalktalk";
}

function renderMeta(){
  $("protection").value = play.protection || "";
  $("alerts").value = (play.alerts || []).join("\n");
  $("tags").value = (play.tags || []).join(", ");
  $("description").value = play.description || "";
  $("tempo").value = play.tempo || "normal";
  const s = play.situation || {};
  $("sitDown").value = s.down ?? "";
  $("sitDist").value = s.distance ?? "";
  $("sitYard").value = s.yard_line ?? "";
  $("sitHash").value = s.hash_mark ?? "";
  $("sitOut").textContent = describeSituation(play.situation);
  const plan = (qbAssignment() || {}).qb;
  if (plan){
    const key = Object.keys(CATALOG.qb_actions).find(
      k => CATALOG.qb_actions[k]["1"].action === plan.action);
    $("qbAction").value = key || "";
    $("qbSteps").value = plan.steps ?? "";
    $("qbRule").value = plan.rule || "";
    $("qbDir").value = String(plan.direction || 1);
  } else {
    $("qbAction").value = ""; $("qbSteps").value = ""; $("qbRule").value = "";
  }
}

function describeSituation(s){
  if (!s) return "No situation set — the play lands in “Base” on a call sheet.";
  const ord = {1:"1st",2:"2nd",3:"3rd",4:"4th"};
  const bits = [];
  if (s.down) bits.push(`${ord[s.down]}${s.distance != null ? " & " + (s.yard_line != null && s.distance >= s.yard_line ? "Goal" : s.distance) : ""}`);
  if (s.yard_line != null)
    bits.push(s.yard_line === 50 ? "50" : (s.yard_line > 50 ? `Own ${100-s.yard_line}` : `Opp ${s.yard_line}`));
  if (s.hash_mark) bits.push(`${s.hash_mark} Hash`);
  return bits.join(", ") || "No situation set";
}

function readSituation(){
  const down = $("sitDown").value, dist = $("sitDist").value,
        yard = $("sitYard").value, hash = $("sitHash").value;
  if (!down && !dist && !yard && !hash){ play.situation = null; }
  else {
    play.situation = {
      down: down ? +down : null, distance: dist ? +dist : null,
      yard_line: yard ? +yard : null, hash_mark: hash || null,
      tempo: play.tempo || "normal", personnel: null, clock: null,
      score_diff: null, label: null, notes: null,
    };
  }
  $("sitOut").textContent = describeSituation(play.situation);
}

function renderFieldInfo(){
  for (const b of $("levelSeg").children){
    const f = CATALOG.fields[b.dataset.value];
    if (!f) continue;
    b.title = `${f.name} hashes · ±${f.hash_from_center.toFixed(2)} yd from the middle`
            + ` · on a hash: boundary ${f.boundary} / field ${f.field_side}`;
  }
}

function renderStage(){

function renderAll(){

/* ─── export / import ───────────────────────────────────────────────────── */
function exportPlay(){
  const out = clone(play);
  syncFormation();
  out.formation.players = clone(play.formation.players);
  if (out.defense) delete out.defense._key;
  return out;
}

function playJson(){ return JSON.stringify(exportPlay(), null, 2); }

function download(name, text, type){
  const blob = new Blob([text], {type: type || "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function slug(s){
  return (s || "play").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
}

function exportSvg(){
  const svg = renderSvg();
  svg.querySelector("#ui").remove();
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + svg.outerHTML;
}

// Rasterise the diagram exactly as drawn — the SVG painted onto a canvas at 2x.
function exportPng(scaleUp){
  scaleUp = scaleUp || 2;
  const svg = renderSvg();
  const w = +svg.getAttribute("width"), h = +svg.getAttribute("height");
  const url = URL.createObjectURL(new Blob([exportSvg()], {type:"image/svg+xml;charset=utf-8"}));
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = Math.round(w * scaleUp); c.height = Math.round(h * scaleUp);
    const ctx = c.getContext("2d");
    ctx.scale(scaleUp, scaleUp); ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    c.toBlob(b => {
      const u = URL.createObjectURL(b);
      const a = document.createElement("a");
      a.href = u; a.download = slug(play.name) + ".png"; a.click();
      setTimeout(() => URL.revokeObjectURL(u), 1000);
    }, "image/png");
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("This browser would not rasterise the SVG"); };
  img.src = url;
}

function loadPlay(obj){
  if (!obj || !obj.assignments || !obj.formation)
    return toast("That doesn't look like a play");
  pushUndo();
  play = obj;
  play.tags = play.tags || [];
  play.alerts = play.alerts || [];
  play.adjustments = play.adjustments || [];
  play.tempo = play.tempo || "normal";
  sel = null; selWp = -1;
  renderAll();
  toast(`Loaded ${play.name}`);
}

/* ─── persistence ───────────────────────────────────────────────────────── */
const LS_KEY = "chalktalk.designer.play";
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(exportPlay())); } catch(e){}
}
function restore(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}

/* ─── boot ──────────────────────────────────────────────────────────────── */
function fitScale(){
  // Fit the field to whatever the chrome leaves free; it is the window.
  const box = $("stageBox");
  const availW = Math.max(0, box.clientWidth - 8), availH = Math.max(0, box.clientHeight - 8);
  const spanX = X_RANGE[1] - X_RANGE[0], spanY = Y_RANGE[1] - Y_RANGE[0];
  SCALE = Math.max(6.5, Math.min(26, (availW - 2*PAD) / spanX, (availH - 2*PAD) / spanY));
}

const LS_SHEET = "chalktalk.designer.sheet";
const LS_LAYERS = "chalktalk.designer.layers";
const LS_LOOK = "chalktalk.designer.look";
function saveLook(){ try { localStorage.setItem(LS_LOOK, look); } catch(e){} }
function loadLook(){
  try { const v = localStorage.getItem(LS_LOOK); if (v && CATALOG.themes && CATALOG.themes[v]) look = v; } catch(e){}
}
let sheetOpen = false;

function setSheet(open, quiet){
  sheetOpen = open;
  $("app").classList.toggle("sheet-open", open);
  $("btnSheet").classList.toggle("on", open);
  try { localStorage.setItem(LS_SHEET, open ? "1" : "0"); } catch(e){}
  if (!quiet){ fitScale(); renderStage(); }
}
function saveLayers(){
  try { localStorage.setItem(LS_LAYERS, JSON.stringify(layers)); } catch(e){}
}
function loadLayers(){
  try {
    const raw = JSON.parse(localStorage.getItem(LS_LAYERS) || "null");
    if (raw) for (const k of LAYER_KEYS) if (typeof raw[k] === "boolean") layers[k] = raw[k];
  } catch(e){}
}
function setLevel(k){ level = k; setSeg($("levelSeg"), k); renderStage(); }

/* ─── command palette ───────────────────────────────────────────────────── */
let palIdx = 0, palItems = [];
const LEVEL_SHORT = {nfl:"NFL", ncaa:"NCAA", hs:"HS"};

function commands(){
  const out = [];
  const add = (group, label, run, hint) => out.push({group, label, run, hint});
  add("Play", "Flip the play", flipPlay, "F");
  add("Play", "Undo", undo, "Ctrl+Z");
  add("Play", "Base block the whole line", blockOl);
  add("Play", sheetOpen ? "Hide the play sheet" : "Show the play sheet", () => setSheet(!sheetOpen));
  add("Play", "Remove the defense", () => setDefense(null));
  add("Play", "Show every layer", () => { for (const k of LAYER_KEYS) layers[k] = true; saveLayers(); renderAll(); });
  add("File", "Save play (.json)", () => download(slug(play.name) + ".json", playJson()));
  add("File", "Download SVG", () => download(slug(play.name) + ".svg", exportSvg(), "image/svg+xml"));
  add("File", "Download PNG", () => exportPng(2));
  add("File", "View JSON", () => openIo("JSON", playJson()));
  add("File", "Import a play", () => openIo("Paste a play JSON", ""));
  for (const v of Object.values(CATALOG.plays)) add("Load", v.name, () => loadPlay(clone(v)));
  for (const [k, v] of Object.entries(CATALOG.formations))
    add("Formation", `${v.name} (${v.personnel})`, () => { setFormation(k); toast(v.name); });
  for (const [k, v] of Object.entries(CATALOG.defenses)) add("Defense", v.name, () => setDefense(k));
  for (const k of CATALOG.coverages) add("Coverage", words(k), () => applyCoverage(k));
  for (const k of Object.keys(CATALOG.schemes)){
    add("Scheme", `${words(k)} right`, () => { lastScheme = k; applyScheme(k, 1); });
    add("Scheme", `${words(k)} left`,  () => { lastScheme = k; applyScheme(k, -1); });
  }
  for (const [k, v] of Object.entries(CATALOG.fields))
    add("View", `${v.name} hashes`, () => setLevel(k));
  for (const k of Object.keys(CATALOG.themes || {}))
    add("View", `Draw on ${k}`, () => { look = k; saveLook(); renderAll(); });
  for (const [key, name] of LAYER_DEFS)
    add("Layer", `${layers[key] ? "Hide" : "Show"} ${name.toLowerCase()}`,
        () => { layers[key] = !layers[key]; saveLayers(); renderAll(); });
  return out;
}

function openPalette(){
  $("palInput").value = ""; palIdx = 0; drawPalette("");
  $("palette").showModal(); $("palInput").focus();
}
function drawPalette(q){
  const list = $("palList"); list.innerHTML = "";
  q = q.trim().toLowerCase();
  const score = c => {
    if (!q) return 1;
    const l = c.label.toLowerCase(), g = c.group.toLowerCase();
    if (l.startsWith(q)) return 3;
    if (l.includes(q)) return 2;
    if ((g + " " + l).includes(q)) return 1;
    return 0;
  };
  palItems = commands().map(c => [score(c), c]).filter(([s]) => s > 0)
    .sort((a, b) => b[0] - a[0]).slice(0, 12).map(([, c]) => c);
  if (palIdx >= palItems.length) palIdx = 0;
  if (!palItems.length){ list.innerHTML = `<div class="pal-empty">Nothing matches.</div>`; return; }
  palItems.forEach((c, i) => {
    const b = document.createElement("button"); b.type = "button";
    b.className = "pal-item" + (i === palIdx ? " on" : "");
    b.innerHTML = `<span class="grp">${esc(c.group)}</span><span class="nm">${esc(c.label)}</span>`
                + (c.hint ? `<kbd>${esc(c.hint)}</kbd>` : "");
    b.onclick = () => runCommand(c);
    list.appendChild(b);
  });
}
function runCommand(c){ $("palette").close(); c.run(); }

/* ─── wiring ────────────────────────────────────────────────────────────── */
function boot(){
  play = INITIAL_PLAY || restore()
      || newPlay(CATALOG.default_formation || Object.keys(CATALOG.formations)[0]);
  loadLayers(); loadLook();

  segment($("playTypeSeg"), [["pass","Pass"],["run","Run"],["rpo","RPO"],
    ["screen","Screen"],["special","Special"]], play.play_type, v => {
    play.play_type = v; setSeg($("playTypeSeg"), v); renderStage(); save();
  });
  segment($("levelSeg"),
    Object.entries(CATALOG.fields).map(([k,v]) => [k, LEVEL_SHORT[k] || v.name, v.name + " hashes"]),
    level, setLevel);

  fillSelect($("tempo"), [["normal","Normal"],["no_huddle","No huddle"],
    ["check","Check with me"],["freeze","Freeze"],["kill","Kill"]], play.tempo);
  $("tempo").onchange = e => { play.tempo = e.target.value; save(); };
  fillSelect($("sitHash"), [["L","Left"],["M","Middle"],["R","Right"]],
    play.situation?.hash_mark, "Any");

  $("playName").oninput = e => { play.name = e.target.value; renderStage(); save();
    document.title = (play.name ? play.name + " · " : "") + "Chalktalk"; };
  $("formationName").oninput = e => { play.formation.name = e.target.value;
    e.target.style.width = Math.min(30, Math.max(9, e.target.value.length + 1)) + "ch"; renderStage(); save(); };
  $("personnel").oninput = e => { play.formation.personnel = e.target.value; renderStage(); save(); };
  $("protection").oninput = e => { play.protection = e.target.value || null; save(); };
  $("alerts").oninput = e => {
    play.alerts = e.target.value.split("\n").map(s=>s.trim()).filter(Boolean); save();
  };
  $("tags").oninput = e => {
    play.tags = e.target.value.split(",").map(s=>s.trim()).filter(Boolean); save();
  };
  $("description").oninput = e => { play.description = e.target.value || null; save(); };
  for (const id of ["sitDown","sitDist","sitYard","sitHash"])
    $(id).onchange = () => { readSituation(); renderStage(); save(); };

  fillSelect($("qbAction"),
    Object.keys(CATALOG.qb_actions).map(k => [k, words(k)]),
    null, "No quarterback plan");
  $("qbAction").onchange = e => {
    const a = qbAssignment() || findA("QB");
    if (!a) return toast("No quarterback on the field");
    pushUndo();
    if (!e.target.value){ a.qb = null; }
    else {
      const previous = a.qb || {};
      a.qb = clone(CATALOG.qb_actions[e.target.value][String(qbDir)]);
      a.qb.reads = previous.reads || [];
    }
    renderAll();
  };
  $("qbDir").onchange = e => {
    qbDir = +e.target.value;
    const a = qbAssignment();
    const chosen = $("qbAction").value;
    if (a && a.qb && chosen){
      pushUndo();
      const reads = a.qb.reads, rule = a.qb.rule;
      a.qb = clone(CATALOG.qb_actions[chosen][String(qbDir)]);
      a.qb.reads = reads; a.qb.rule = rule;
    }
    renderAll();
  };
  $("qbSteps").onchange = e => {
    const a = qbAssignment();
    if (a && a.qb){ a.qb.steps = e.target.value ? +e.target.value : null; save(); renderStage(); }
  };
  $("qbRule").onchange = e => {
    const a = qbAssignment();
    if (a && a.qb){ a.qb.rule = e.target.value || null; save(); }
  };

  $("btnFlip").onclick = flipPlay;
  $("btnUndo").onclick = undo;
  $("btnSheet").onclick = () => setSheet(!sheetOpen);
  $("btnSheetClose").onclick = () => setSheet(false);
  $("btnSave").onclick = () => download(slug(play.name) + ".json", playJson());
  $("btnSvg").onclick = () => { $("exportMenu").hidden = true; download(slug(play.name) + ".svg", exportSvg(), "image/svg+xml"); };
  $("btnJson").onclick = () => { $("exportMenu").hidden = true; openIo("JSON", playJson()); };
  $("btnPng").onclick = () => { $("exportMenu").hidden = true; exportPng(2); };
  $("btnImport").onclick = () => openIo("Paste a play JSON", "");
  $("btnExport").onclick = () => { $("exportMenu").hidden = !$("exportMenu").hidden; };

  for (const b of $("rail").querySelectorAll("button"))
    b.onclick = () => openPop(b.dataset.pop);
  document.addEventListener("pointerdown", e => {
    if (!e.target.closest("#pop, #rail")) closePop();
    if (!e.target.closest(".menu-wrap")) $("exportMenu").hidden = true;
  });

  $("ioClose").onclick = () => $("ioDialog").close();
  $("ioCopy").onclick = async () => {
    try { await navigator.clipboard.writeText($("ioText").value); toast("Copied"); }
    catch(e){ $("ioText").select(); document.execCommand("copy"); toast("Copied"); }
  };
  $("ioLoad").onclick = () => {
    try { loadPlay(JSON.parse($("ioText").value)); $("ioDialog").close(); }
    catch(e){ toast("Invalid JSON"); }
  };

  $("palInput").oninput = e => { palIdx = 0; drawPalette(e.target.value); };
  $("palInput").onkeydown = e => {
    if (!palItems.length) return;
    if (e.key === "ArrowDown"){ e.preventDefault(); palIdx = (palIdx + 1) % palItems.length; drawPalette(e.target.value); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); palIdx = (palIdx - 1 + palItems.length) % palItems.length; drawPalette(e.target.value); }
    else if (e.key === "Enter"){ e.preventDefault(); runCommand(palItems[palIdx]); }
  };

  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openPalette(); return; }
    if (e.target && e.target.matches && e.target.matches("input,textarea,select")) return;
    if ((e.ctrlKey||e.metaKey) && e.key === "z"){ e.preventDefault(); undo(); }
    else if (e.key === "f" || e.key === "F"){ flipPlay(); }
    else if (e.key === "Escape"){
      if (pop) return closePop();
      if (!$("exportMenu").hidden) return ($("exportMenu").hidden = true);
      sel = null; selDef = null; selWp = -1; renderAll();
    }
    else if (e.key.startsWith("Arrow") && (sel || selDef)){
      e.preventDefault();
      const step = e.shiftKey ? 1 : 0.5;
      nudge(e.key === "ArrowLeft" ? -step : e.key === "ArrowRight" ? step : 0,
            e.key === "ArrowUp" ? step : e.key === "ArrowDown" ? -step : 0);
    }
    else if (e.key === "Backspace" && sel){
      const a = selA();
      if (a && a.route && a.route.waypoints.length > 2){
        pushUndo(); a.route.waypoints.pop(); renderAll();
      }
    }
  });

  window.addEventListener("resize", () => { fitScale(); renderStage(); });
  try { setSheet(localStorage.getItem(LS_SHEET) === "1", true); } catch(e){}
  renderAll();
}

function openIo(title, text){
  $("ioTitle").textContent = title;
  $("ioText").value = text;
  $("ioDialog").showModal();
}

boot();
</script>
</body>
</html>
