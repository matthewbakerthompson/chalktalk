<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalktalk Designer</title>
<style>
/* ─── tokens ────────────────────────────────────────────────────────────
   Graphite tinted a hair toward the field, chalk-white ink, and one accent:
   the yellow the diagram already uses for selection, the ball and the QB. */
:root{
  color-scheme:dark;
  --bg:      oklch(0.165 0.006 160);
  --panel:   oklch(0.205 0.006 160);
  --panel-2: oklch(0.250 0.007 160);
  --well:    oklch(0.150 0.006 160);
  --hair:    oklch(1 0 0 / 0.08);
  --hair-2:  oklch(1 0 0 / 0.15);
  --ink:     oklch(0.955 0.006 95);
  --ink-2:   oklch(0.840 0.008 120);
  --muted:   oklch(0.690 0.012 150);
  --faint:   oklch(0.520 0.012 150);
  --accent:      oklch(0.870 0.160 92);
  --accent-hi:   oklch(0.905 0.160 92);
  --accent-ink:  oklch(0.230 0.050 92);
  --accent-soft: oklch(0.870 0.160 92 / 0.14);
  --accent-line: oklch(0.870 0.160 92 / 0.55);
  --danger:  oklch(0.740 0.160 25);
  --motion:  oklch(0.850 0.090 220);
  --offense: #f4f1e8;          /* the diagram's chalk */
  --offense-ring: #15221b;
  --offense-ink: #15221b;
  --defense: #222d28;          /* the diagram's defensive ink */
  --defense-ring: #cfd6d1;
  --defense-ink: #f4f1e8;
  --float: 0 1px 0 oklch(1 0 0 / .04) inset, 0 0 0 1px oklch(0 0 0 / .35), 0 14px 34px -14px oklch(0 0 0 / .85);
  --r-1:6px; --r-2:8px; --r-3:12px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --t:150ms var(--ease);
  --z-hud:2; --z-dock:3; --z-pop:20; --z-sheet:25; --z-toast:30;
  --sans:"Inter",ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.45 var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-soft)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
h1,h2,h3,p{margin:0}
code{font-family:var(--mono);font-size:.92em;color:var(--ink-2)}

/* ─── controls ──────────────────────────────────────────────────────── */
button{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:28px;padding:0 10px;border:1px solid var(--hair-2);border-radius:var(--r-1);
  background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:500;
  cursor:pointer;white-space:nowrap;
  transition:background var(--t),border-color var(--t),color var(--t);
}
button:hover{background:oklch(1 0 0 / .06);border-color:oklch(1 0 0 / .22);color:var(--ink)}
button:active{background:oklch(1 0 0 / .1)}
button:disabled{opacity:.45;cursor:default}
button svg{width:14px;height:14px;flex:none}
button.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
button.primary:hover{background:var(--accent-hi);color:var(--accent-ink)}
button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
button.on:hover{background:oklch(0.870 0.160 92 / .2);color:var(--accent)}
button.danger:hover{color:var(--danger);border-color:oklch(0.740 0.160 25 / .5);background:oklch(0.740 0.160 25 / .08)}
button.ghost{border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink)}
button.icon{width:28px;padding:0}
button.wide{width:100%;margin-top:10px}

input,select,textarea{
  width:100%;height:28px;padding:0 8px;
  background:var(--well);border:1px solid var(--hair);border-radius:var(--r-1);
  transition:border-color var(--t),box-shadow var(--t);
}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input:hover,select:hover,textarea:hover{border-color:var(--hair-2)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=number]{font-variant-numeric:tabular-nums}
select{
  appearance:none;-webkit-appearance:none;padding-right:24px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23a3ada8' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;
  text-overflow:ellipsis;
}
textarea{height:auto;min-height:64px;padding:6px 8px;resize:vertical;line-height:1.45}
textarea.code{font-family:var(--mono);font-size:11.5px;line-height:1.5;min-height:320px}
label{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin:0 0 4px}
label .sub{font-weight:400;color:var(--muted);margin-left:4px}
kbd{
  display:inline-block;min-width:16px;padding:0 4px;border-radius:4px;
  background:oklch(1 0 0 / .07);border:1px solid var(--hair-2);
  font-family:inherit;font-size:10.5px;line-height:16px;text-align:center;color:var(--ink-2);
}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.field{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.note{color:var(--muted);font-size:12px;line-height:1.45;margin-top:10px}
.sep{width:1px;height:20px;background:var(--hair-2);margin:0 4px;flex:none}
h2{font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 10px;display:flex;align-items:baseline;gap:6px}
h2 .sub{font-weight:400;color:var(--muted);font-size:11.5px}
h3{
  font-size:12px;font-weight:600;color:var(--ink-2);
  margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--hair);
}
h3.first{margin-top:0;padding-top:0;border-top:0}

/* segmented control — one raised segment, no accent on the idle ones */
.seg{display:inline-flex;gap:2px;padding:2px;background:var(--well);border:1px solid var(--hair);border-radius:var(--r-1)}
.seg button{height:22px;padding:0 9px;border:0;border-radius:4px;background:transparent;color:var(--muted);font-size:12px}
.seg button:hover{background:oklch(1 0 0 / .05);color:var(--ink)}
.seg button.on{background:var(--panel-2);color:var(--ink);box-shadow:0 1px 0 oklch(0 0 0 / .35),inset 0 0 0 1px var(--hair-2)}
.seg.full{display:flex}
.seg.full button{flex:1}
.seg.sm{padding:1px;gap:1px}
.seg.sm button{height:20px;padding:0 7px;font-size:11.5px}

.card{background:var(--panel);border:1px solid var(--hair-2);border-radius:10px;box-shadow:var(--float)}

/* ─── shell: the field is the window; chrome floats over it ─────────── */
#app{display:flex;height:100vh;overflow:hidden;position:relative}
.work{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.canvas{
  flex:1;min-height:0;position:relative;
  background-image:radial-gradient(oklch(1 0 0 / .05) 1px,transparent 1px);
  background-size:22px 22px;background-position:center;
}
.stage-box{
  position:absolute;top:86px;right:16px;bottom:12px;left:86px;
  display:flex;align-items:center;justify-content:center;overflow:auto;
  scrollbar-width:thin;scrollbar-color:oklch(1 0 0 / .15) transparent;
}
#stage{
  flex:none;border-radius:8px;background:transparent;
  border:1px solid oklch(1 0 0 / .12);
  box-shadow:0 0 0 1px oklch(0 0 0 / .5),0 30px 60px -30px oklch(0 0 0 / .9);
}
svg{display:block;border-radius:7px}
#stage.paper{border-color:oklch(0 0 0 / .35);box-shadow:0 0 0 1px oklch(0 0 0 / .2),0 30px 60px -30px oklch(0 0 0 / .7)}
svg *{-webkit-user-select:none;user-select:none}
.grabbable{cursor:grab}
.grabbing{cursor:grabbing}

/* top HUD */
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:flex-start;gap:10px;pointer-events:none;z-index:var(--z-hud)}
.hud>*{pointer-events:auto}
.title-block{display:flex;align-items:center;gap:10px;padding:5px 10px;min-width:0;max-width:calc(100% - 560px)}
.brand{
  display:flex;align-items:center;gap:7px;height:44px;padding-right:10px;border-right:1px solid var(--hair);
  font-size:14px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;user-select:none;
}
.brand b{font-weight:650;color:var(--muted)}
.brand svg{width:15px;height:15px;color:var(--accent)}
.title-col{display:flex;flex-direction:column;min-width:0}
.title{
  width:clamp(160px,28vw,360px);height:28px;padding:0 6px;
  background:transparent;border:1px solid transparent;
  font-size:15px;font-weight:600;letter-spacing:-.01em;
}
.title:hover{border-color:var(--hair)}
.title:focus{background:var(--well);border-color:var(--accent);box-shadow:none}
.title-meta{display:flex;align-items:center;gap:6px;padding:0 4px;color:var(--muted);font-size:12px;min-width:0}
.title-meta .dot{color:var(--faint)}
.inline{height:22px;padding:0 4px;background:transparent;border:1px solid transparent;font-size:12px;color:var(--ink-2);width:auto;min-width:0}
.inline:hover{border-color:var(--hair)}
.inline:focus{background:var(--well);border-color:var(--accent);box-shadow:none;color:var(--ink)}
.inline.fm{width:17ch}
.inline.pers{width:4ch;text-align:center;font-variant-numeric:tabular-nums}
.actions{display:flex;align-items:center;gap:6px;padding:6px;flex:none}
.actions .sep{margin:0 2px}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:180px;padding:4px;display:flex;flex-direction:column;gap:1px;z-index:var(--z-pop)}
.menu button{justify-content:flex-start;border:0;height:30px;padding:0 10px;color:var(--ink-2);width:100%}
.menu button:hover{background:oklch(1 0 0 / .06)}
.chev{width:10px!important;height:10px!important;opacity:.7}

/* tool rail + popovers */
.rail{position:absolute;left:12px;top:86px;display:flex;flex-direction:column;gap:2px;padding:4px;z-index:var(--z-hud)}
.rail button{position:relative;flex-direction:column;gap:4px;width:56px;height:54px;border:0;padding:0;font-size:10.5px;font-weight:500;color:var(--muted);border-radius:8px}
.rail button svg{width:18px;height:18px}
.rail button:hover{color:var(--ink)}
.rail button.on{background:var(--accent-soft);color:var(--accent)}
.rail button.dim::after{content:"";position:absolute;top:7px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.layer{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:var(--r-1);cursor:pointer;font-size:12.5px;color:var(--ink-2);margin:0}
.layer:hover{background:oklch(1 0 0 / .05)}
.layer.off{opacity:.45;cursor:default}
.layer input{width:14px;height:14px;margin:0;accent-color:var(--accent);flex:none}
.layer .nm{font-weight:500;min-width:88px}
.layer .meta{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop{
  position:absolute;left:84px;top:86px;width:344px;max-height:calc(100% - 98px);
  display:flex;flex-direction:column;overflow:hidden;z-index:var(--z-pop);
  animation:pop-in 160ms var(--ease);
}
@keyframes pop-in{from{opacity:0;transform:translateX(-4px)}}
.pop-head{display:flex;align-items:baseline;gap:8px;padding:12px 14px 8px;flex:none}
.pop-head h2{margin:0}
.pop-body{overflow-y:auto;padding:0 14px 14px;scrollbar-width:thin;scrollbar-color:oklch(1 0 0 / .15) transparent}
.pop-body>input{margin-bottom:8px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card-pick{
  display:flex;flex-direction:column;align-items:stretch;gap:1px;height:auto;padding:7px 8px;
  border-color:var(--hair);color:var(--ink-2);text-align:left;
}
.card-pick:hover{border-color:var(--hair-2);background:oklch(1 0 0 / .04)}
.card-pick.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.card-pick .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-pick .pers{font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-pick.on .pers{color:var(--accent)}
.card-pick.none{justify-content:center;align-items:center;min-height:70px}
.thumb{width:100%;height:auto;display:block;color:var(--ink-2);margin-bottom:5px;border-radius:4px;background:oklch(1 0 0 / .045)}
.card-pick.on .thumb{color:var(--accent)}
.thumb .los{stroke:currentColor;stroke-opacity:.35;stroke-width:1;stroke-dasharray:3 2}
.thumb circle,.thumb rect{fill:currentColor}
.list{display:flex;flex-direction:column;gap:2px}
.list.two{display:grid;grid-template-columns:1fr 1fr}
.row-pick{justify-content:space-between;height:30px;padding:0 10px;border-color:transparent;color:var(--ink-2);text-align:left;gap:8px}
.row-pick .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-pick .meta,.row-pick .tag{font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}
.row-pick:hover{background:oklch(1 0 0 / .06)}
.row-pick.on{background:var(--accent-soft);color:var(--accent)}
.row-pick.on .meta,.row-pick.on .tag{color:var(--accent)}
.row-pick:disabled{opacity:.4}

/* ─── dock: inspector strip + bench ─────────────────────────────────── */
.dock{flex:none;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--hair);z-index:var(--z-dock)}
.inspector{min-height:100px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:8px 16px;border-bottom:1px solid var(--hair)}
.insp-in{animation:insp-in 180ms var(--ease)}
@keyframes insp-in{from{opacity:0;transform:translateY(3px)}}
.ihead{display:flex;flex-direction:column;gap:3px;min-width:170px;margin-right:4px}
.ihead .top{display:flex;align-items:baseline;gap:8px}
.ihead .tip{font-size:11px;color:var(--muted);white-space:nowrap}
.ihead .glyph{align-self:center;width:12px;height:12px;flex:none;border-radius:50%;background:var(--offense);border:1.5px solid var(--offense-ring)}
.ihead .glyph.def{background:var(--defense);border-color:var(--defense-ring);border-radius:2px}
.ihead .who{font-size:18px;font-weight:650;letter-spacing:-.01em;line-height:1}
.ihead .what{color:var(--muted);font-size:12px}
.ifield{display:flex;flex-direction:column;gap:3px}
.ifield label{margin:0;font-size:10.5px}
.ifield input,.ifield select{height:26px}
.ifield.grow{flex:1;min-width:150px}
.isep{width:1px;height:36px;background:var(--hair-2);align-self:center}
.btns{display:flex;gap:6px}
.btns button{height:26px}
.w56{width:60px}.w72{width:78px}.w104{width:110px}.w130{width:136px}.w140{width:154px}
.wps{display:flex;align-items:center;gap:4px;height:26px}
.wp{height:24px;min-width:24px;padding:0 7px;border-radius:99px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.wp.sel{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.wpxy{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 2px;white-space:nowrap}
.wpdel{height:24px;width:24px;padding:0;border-color:transparent;color:var(--muted);font-size:15px;line-height:1}
.wpdel:hover{color:var(--danger);background:oklch(0.740 0.160 25 / .1)}
.empty{color:var(--muted);font-size:12.5px;line-height:1.6;display:flex;flex-direction:column;gap:2px}
.empty .lead{color:var(--ink-2);font-weight:600;margin-right:4px}
.empty .legend{font-size:12px}
.empty .legend b{color:var(--ink-2);font-weight:600}
.empty kbd{margin:0 1px}

.bench{display:flex;align-items:center;gap:12px;padding:6px 12px 6px}
.tokens{display:flex;align-items:flex-start;flex:1;min-width:0;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;scrollbar-color:oklch(1 0 0 / .15) transparent}
.tok{display:flex;flex-direction:column;align-items:center;gap:4px;width:50px;flex:none;padding:5px 0 4px;border:0;border-radius:8px;background:transparent;height:auto}
.tok:hover{background:oklch(1 0 0 / .05)}
.tok .c{
  position:relative;width:26px;height:26px;border-radius:50%;
  background:var(--offense);border:1.5px solid var(--offense-ring);
  color:var(--offense-ink);font-size:10px;font-weight:700;display:grid;place-items:center;
}
.tok .c.ball{border-color:var(--accent);border-width:2px}
.tok.ol .c{width:22px;height:22px;font-size:9px;opacity:.6;margin-top:2px}
.tok.def .c{border-radius:4px;background:var(--defense);border-color:var(--defense-ring);color:var(--defense-ink)}
.tok .c.mo::before{content:"";position:absolute;top:-4px;left:-4px;width:9px;height:9px;border-radius:50%;background:var(--motion);border:2px solid var(--panel)}
.tok .a{font-size:10.5px;color:var(--muted);max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok.sel{background:var(--accent-soft)}
.tok.sel .c{box-shadow:0 0 0 2px #fde047}
.tok.sel .a{color:var(--ink)}
.tok-sep{width:1px;height:34px;background:var(--hair-2);margin:6px 8px 0;flex:none}
.bench-right{display:flex;align-items:center;gap:10px;flex:none;color:var(--muted);font-size:11.5px}
.fieldinfo{white-space:nowrap;font-variant-numeric:tabular-nums}
.fieldinfo b{color:var(--ink-2);font-weight:500}

/* ─── play sheet drawer ─────────────────────────────────────────────── */
.sheet{display:none;flex:none;width:320px;flex-direction:column;background:var(--panel);border-left:1px solid var(--hair);min-height:0}
#app.sheet-open .sheet{display:flex}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--hair);flex:none}
.sheet-head h2{margin:0;flex:1;font-size:13px}
.sheet-body{flex:1;overflow-y:auto;padding:0 16px 16px;scrollbar-width:thin;scrollbar-color:oklch(1 0 0 / .15) transparent}
.sheet-body h3.first{padding-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:500;color:var(--ink-2)}
.chip .n{
  display:inline-grid;place-items:center;width:15px;height:15px;margin-left:-4px;
  border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;
}
.chip.sel{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

/* ─── toast, dialogs, palette ───────────────────────────────────────── */
#toast{
  position:absolute;left:50%;bottom:16px;z-index:var(--z-toast);
  display:flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;
  background:var(--panel-2);border:1px solid var(--hair-2);border-radius:99px;
  box-shadow:0 12px 32px oklch(0 0 0 / .55);
  font-size:12.5px;font-weight:500;color:var(--ink);
  opacity:0;transform:translate(-50%,8px);pointer-events:none;
  transition:opacity var(--t),transform var(--t);
}
#toast::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
dialog{
  width:100%;max-width:min(720px,92vw);padding:0;
  background:var(--panel);color:var(--ink);
  border:1px solid var(--hair-2);border-radius:var(--r-3);
  box-shadow:0 40px 80px -20px oklch(0 0 0 / .8);
}
dialog::backdrop{background:oklch(0 0 0 / .6)}
.dlg-head{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--hair)}
.dlg-head h2{margin:0;font-size:13px;flex:1}
.dlg-body{padding:14px 16px}
.dlg-foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--hair)}
.dlg-foot .note{margin:0 auto 0 0}
dialog.palette{max-width:min(560px,92vw);margin-top:12vh}
.pal-input{height:46px;border:0;border-bottom:1px solid var(--hair);border-radius:0;background:transparent;font-size:14px;padding:0 16px}
.pal-input:focus{box-shadow:none;border-color:var(--hair)}
.pal-list{max-height:min(440px,60vh);overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:oklch(1 0 0 / .15) transparent}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;height:32px;border:0;padding:0 10px;justify-content:flex-start;color:var(--ink-2);border-radius:var(--r-1)}
.pal-item .grp{font-size:11px;color:var(--muted);min-width:72px;text-align:left}
.pal-item .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item.on{background:var(--accent-soft);color:var(--ink)}
.pal-item.on .grp{color:var(--accent)}
.pal-empty{padding:14px;color:var(--muted);font-size:12.5px}

/* ─── responsive ────────────────────────────────────────────────────── */
@media (max-width:1100px){
  .hud{flex-wrap:wrap}
  .title-block{max-width:100%}
  .stage-box{top:132px}
  .rail{top:132px}
  .pop{top:132px;width:min(344px,calc(100vw - 100px));max-height:calc(100% - 144px)}
  .sheet{position:absolute;right:0;top:0;bottom:0;z-index:var(--z-sheet);box-shadow:-20px 0 40px -20px oklch(0 0 0 / .8)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div id="app">
  <div class="work">
    <div class="canvas" id="canvas">
      <div class="stage-box" id="stageBox"><div id="stage"></div></div>

      <div class="hud">
        <div class="card title-block">
          <div class="brand" title="chalktalk">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="3.2"
              stroke-linecap="round" aria-hidden="true"><path d="M3.5 12.5 12.5 3.5"/></svg>
            <span>chalk<b>talk</b></span>
          </div>
          <div class="title-col">
            <input id="playName" class="title" placeholder="Untitled play" spellcheck="false"
              aria-label="Play name" autocomplete="off">
            <div class="title-meta">
              <input id="formationName" class="inline fm" placeholder="Formation" aria-label="Formation name"
                spellcheck="false" autocomplete="off">
              <span class="dot">&middot;</span>
              <input id="personnel" class="inline pers" placeholder="11" aria-label="Personnel" autocomplete="off">
              <span class="dot">&middot;</span>
              <div class="seg sm" id="playTypeSeg" role="group" aria-label="Play type"></div>
            </div>
          </div>
        </div>

        <div class="card actions">
          <button id="btnUndo" title="Undo (Ctrl+Z)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3.5 6.5h6a3 3 0 0 1 0 6H6"/><path d="M6 3.5 3 6.5l3 3"/></svg>Undo</button>
          <button id="btnFlip" title="Mirror the play (F)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 2v12"/><path d="M5 5 2 8l3 3"/><path d="m11 5 3 3-3 3"/></svg>Flip</button>
          <div class="sep"></div>
          <button id="btnSheet" title="Quarterback, call sheet, situation and notes">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5.5 6h5M5.5 8.5h5M5.5 11h3"/></svg>Play sheet</button>
          <div class="sep"></div>
          <button id="btnImport" title="Paste a play JSON">Import</button>
          <div class="menu-wrap">
            <button id="btnExport" title="Export the play" aria-haspopup="menu">Export
              <svg class="chev" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button>
            <div class="card menu" id="exportMenu" role="menu" hidden>
              <button id="btnSvg" role="menuitem">Download SVG</button>
              <button id="btnPng" role="menuitem">Download PNG</button>
              <button id="btnJson" role="menuitem">View JSON</button>
            </div>
          </div>
          <button class="primary" id="btnSave" title="Download this play as .json">Save</button>
        </div>
      </div>

      <div class="card rail" id="rail" role="toolbar" aria-label="Build">
        <button data-pop="formation" title="Formation">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" aria-hidden="true">
            <path d="M2 5.5h12" stroke-dasharray="2 1.5" stroke-opacity=".6"/>
            <circle cx="3" cy="8.5" r="1.3"/><circle cx="6.5" cy="8.5" r="1.3"/><circle cx="9.5" cy="8.5" r="1.3"/>
            <circle cx="13" cy="8.5" r="1.3"/><circle cx="8" cy="12.5" r="1.3"/></svg>Formation</button>
        <button data-pop="line" title="Line scheme">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 13V8M8 13V8M13 13V8"/><path d="M3 8l2-3M8 8l2-3M13 8l2-3"/><path d="M2 5h2M7 5h2M12 5h2"/></svg>Line</button>
        <button data-pop="defense" title="Defense">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 2.5 13 4.5v3.4c0 3-2.1 5-5 6-2.9-1-5-3-5-6V4.5z"/></svg>Defense</button>
        <button data-pop="library" title="Concept library">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3.5h4a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 0 7 11.5H3z"/>
            <path d="M13 3.5H9A1.5 1.5 0 0 0 7.5 5v8A1.5 1.5 0 0 1 9 11.5h4z"/></svg>Library</button>
        <button data-pop="layers" title="Show or hide parts of the diagram">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m8 2.5 6 3-6 3-6-3z"/><path d="m2 8.5 6 3 6-3"/><path d="m2 11 6 3 6-3"/></svg>Layers</button>
      </div>
      <div class="card pop" id="pop" hidden></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>

    <div class="dock" id="dock">
      <div class="inspector" id="inspector"></div>
      <div class="bench">
        <div class="tokens" id="playerList"></div>
        <div class="bench-right">
          <div class="seg" id="levelSeg" role="group" aria-label="Field level"></div>
        </div>
      </div>
    </div>
  </div>

  <aside class="sheet" id="sheet" aria-label="Play sheet">
    <div class="sheet-head">
      <h2>Play sheet</h2>
      <button class="ghost icon" id="btnSheetClose" aria-label="Close the play sheet">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="sheet-body">
      <h3 class="first">Quarterback</h3>
      <div class="field"><select id="qbAction" aria-label="Quarterback action"></select></div>
      <div class="grid2">
        <div><label for="qbSteps">Steps</label><input id="qbSteps" type="number" min="0" max="7"></div>
        <div><label for="qbDir">Direction</label><select id="qbDir">
          <option value="1">Right</option><option value="-1">Left</option></select></div>
      </div>
      <div class="field">
        <label>Progression <span class="sub">click receivers in order</span></label>
        <div class="chips" id="readList"></div>
      </div>
      <div class="field"><label for="qbRule">Rule</label><input id="qbRule"
        placeholder="High-low the flat defender" autocomplete="off"></div>

      <h3>Call sheet</h3>
      <div class="grid2">
        <div><label for="protection">Protection</label><input id="protection" placeholder="Slide Rt" autocomplete="off"></div>
        <div><label for="tempo">Tempo</label><select id="tempo"></select></div>
      </div>
      <div class="field"><label for="alerts">Alerts <span class="sub">one per line</span></label>
        <textarea id="alerts" style="min-height:52px"></textarea></div>
      <div class="field"><label for="tags">Tags <span class="sub">comma separated</span></label>
        <input id="tags" autocomplete="off"></div>

      <h3>Situation</h3>
      <div class="grid3">
        <div><label for="sitDown">Down</label><input id="sitDown" type="number" min="1" max="4"></div>
        <div><label for="sitDist">Distance</label><input id="sitDist" type="number" min="0"></div>
        <div><label for="sitHash">Hash</label><select id="sitHash"></select></div>
      </div>
      <div class="field">
        <label for="sitYard">Ball on <span class="sub">yards to opponent goal</span></label>
        <input id="sitYard" type="number" min="1" max="99" placeholder="32 = Opp 32">
      </div>
      <p class="note" id="sitOut"></p>

      <h3>Notes</h3>
      <textarea id="description" style="min-height:90px"
        placeholder="Coaching points, reads, when to call it"></textarea>
    </div>
  </aside>
</div>

<dialog id="ioDialog">
  <div class="dlg-head">
    <h2 id="ioTitle">JSON</h2>
    <button class="ghost icon" id="ioClose" aria-label="Close">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div class="dlg-body"><textarea id="ioText" class="code" spellcheck="false"></textarea></div>
  <div class="dlg-foot">
    <span class="note">The exact schema the Python package reads:
      <code>Play.from_json(...)</code></span>
    <button id="ioCopy">Copy</button>
    <button id="ioLoad" class="primary">Load into designer</button>
  </div>
</dialog>

<dialog id="palette" class="palette" aria-label="Commands">
  <input id="palInput" class="pal-input" placeholder="Type a command, a concept, a formation, a coverage"
    autocomplete="off" spellcheck="false">
  <div class="pal-list" id="palList"></div>
</dialog>

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 1600);
}

function pushUndo(){
  undoStack.push(clone(play));
  if (undoStack.length > 60) undoStack.shift();
}
// Arrow keys move the selection: a defender, a route point, or a player.
// Held keys coalesce into one undo step.
let lastNudge = 0;
function nudge(dx, dy){
  const now = Date.now();
  if (now - lastNudge > 600) pushUndo();
  lastNudge = now;
  if (selDef){
    const d = play.defense && play.defense.players.find(p => p.label === selDef);
    if (d){ d.x = snap(d.x + dx); d.y = snap(d.y + dy); }
  } else {
    const a = selA(); if (!a) return;
    if (selWp >= 0 && a.route && a.route.waypoints[selWp]){
      const [ax, ay] = wpAbs(a.player, a.route.waypoints[selWp]);
      a.route.waypoints[selWp] = wpRel(a.player, snap(ax + dx), snap(ay + dy));
      a.route.route_type = "custom";
    } else {
      a.player.x = snap(a.player.x + dx); a.player.y = snap(a.player.y + dy);
      syncFormation();
    }
  }
  renderAll();
}

function undo(){
  if (!undoStack.length) return toast("Nothing to undo");
  play = undoStack.pop(); sel = null; selWp = -1; renderAll();
}

const H = () => Math.round((Y_RANGE[1]-Y_RANGE[0])*SCALE + 2*PAD);
const sx = x => (x - X_RANGE[0]) * SCALE + PAD;
const sy = y => (Y_RANGE[1] - y) * SCALE + PAD;
const ix = px => (px - PAD) / SCALE + X_RANGE[0];
const iy = py => Y_RANGE[1] - (py - PAD) / SCALE;

const isLeft = p => p.x < -1.0;
// Routes are authored as if the player is on the right; the renderer mirrors
// them for left-side players. Store and display through this pair so a drawn
// path survives the round trip into Python untouched.
const wpAbs = (p, w) => [p.x + (isLeft(p) ? -w.x : w.x), p.y + w.y];
const wpRel = (p, ax, ay) => ({x: (isLeft(p) ? -(ax - p.x) : (ax - p.x)), y: ay - p.y});

/* ─── play helpers ──────────────────────────────────────────────────────── */
const assignments = () => play.assignments;
const findA = lbl => play.assignments.find(a => a.player.label === lbl);
const selA = () => sel ? findA(sel) : null;

function syncFormation(){
  play.formation.players = play.assignments.map(a => clone(a.player));
}

function newPlay(formationKey){
  const f = clone(CATALOG.formations[formationKey]);
  return {
    name: "New Play", concept: null,
    formation: {name: f.name, personnel: f.personnel, players: clone(f.players),
                description: f.description ?? null},
    play_type: "pass",
    assignments: f.players.map(p => ({
      player: p, route: null,
      block: OL.has(p.position) ? clone(CATALOG.blocks.BASE["1"]) : null,
      is_ball_carrier: false, motion_from: null, motion_type: null, note: null,
    })),
    defense: null, description: null, tags: [],
    protection: null, tempo: "normal", alerts: [], adjustments: [],
    situation: null, install_day: null, call_number: null,
  };
}

function setFormation(key){
  pushUndo();
  const f = clone(CATALOG.formations[key]);
  const byLabel = {};
  play.assignments.forEach(a => byLabel[a.player.label] = a);
  play.formation = {name: f.name, personnel: f.personnel, players: clone(f.players),
                    description: f.description ?? null};
  play.assignments = f.players.map(p => {
    const prev = byLabel[p.label];
    return {
      player: p,
      route: prev ? prev.route : null,
      block: prev ? prev.block
                  : (OL.has(p.position) ? clone(CATALOG.blocks.BASE["1"]) : null),
      is_ball_carrier: prev ? prev.is_ball_carrier : false,
      motion_from: null, motion_type: null,
      note: prev ? prev.note : null,
    };
  });
  sel = null; selWp = -1; renderAll();
}

/* mirrors chalktalk/adjustments.py::_motion_geometry */
const SIDELINE_CLAMP = 25.0;
function motionGeometry(kind, x, y){
  const side = x >= 0 ? 1 : -1;
  const cl = v => Math.max(-SIDELINE_CLAMP, Math.min(SIDELINE_CLAMP, v));
  switch(kind){
    case "jet":    return [[x,y],[cl(-side*2.0), y-0.5]];
    case "orbit":  return [[x,y],[cl(-side*5.0), y-4.0]];
    case "across": return [[x,y],[cl(-x), y]];
    case "return": return [[cl(x-side*8.0), y],[x,y]];
    case "out":    return [[cl(x-side*6.0), y],[x,y]];
    case "in":     return [[cl(x+side*6.0), y],[x,y]];
    default:       return [[cl(x-side*3.5), y],[x,y]];
  }
}

function applyMotion(lbl, kind){
  const a = findA(lbl); if (!a) return;
  pushUndo();
  if (!kind){ a.motion_from = null; a.motion_type = null; syncFormation(); return renderAll(); }
  const [origin, snapPos] = motionGeometry(kind, a.player.x, a.player.y);
  a.player.x = snapPos[0]; a.player.y = snapPos[1];
  a.motion_from = origin; a.motion_type = kind;
  syncFormation(); renderAll();
}

function eligibleReceivers(){
  return assignments()
    .map(a => a.player)
    .filter(p => !OL.has(p.position) && p.position !== "QB")
    .sort((a, b) => Math.abs(b.x) - Math.abs(a.x));
}

function matchMan(defenders){
  const receivers = eligibleReceivers();
  const out = {}, taken = new Set();
  if (!receivers.length) return out;
  for (const side of [1, -1]){
    const ds = defenders.filter(d => (d.x >= 0 ? 1 : -1) === side)
                        .sort((a,b) => Math.abs(b.x) - Math.abs(a.x));
    const rs = receivers.filter(r => (r.x >= 0 ? 1 : -1) === side)
                        .sort((a,b) => Math.abs(b.x) - Math.abs(a.x));
    ds.forEach((d, i) => { if (rs[i]){ out[d.label] = rs[i].label; taken.add(rs[i].label); } });
  }
  for (const d of [...defenders].sort((a,b) => Math.abs(a.x) - Math.abs(b.x))){
    if (out[d.label]) continue;
    const options = receivers.filter(r => !taken.has(r.label));
    if (!options.length){ out[d.label] = null; continue; }
    const best = options.reduce((a, b) =>
      Math.abs(a.x - d.x) <= Math.abs(b.x - d.x) ? a : b);
    taken.add(best.label);
    out[d.label] = best.label;
  }
  return out;
}

function applyCoverage(name){
  if (!play.defense) return toast("Pick a defensive look first");
  const byLook = CATALOG.coverage_calls[play.defense.name];
  const call = byLook && byLook[name];
  if (!call) return toast("No call for this look");
  pushUndo();
  const meta = call.__meta__ || {};
  const manDefenders = [];
  for (const d of play.defense.players){
    const assigned = call[d.label];
    d.assignment = assigned ? clone(assigned) : null;
    if (d.assignment && d.assignment.role === "man") manDefenders.push(d);
  }
  // Python picks the rat before it matches anybody, so do the same or the two
  // sides hand back different (both legal) versions of the same call.
  const spare = manDefenders.length - eligibleReceivers().length;
  if (spare > 0 && !meta.pressure){
    const inside = manDefenders.filter(d => LB.has(d.position));
    if (inside.length){
      const rat = inside.reduce((a, b) => Math.abs(a.x) <= Math.abs(b.x) ? a : b);
      rat.assignment = {role:"robot", zone:"hole", side:0, covers:null,
                        gap:null, path:[], note:null};
      manDefenders.splice(manDefenders.indexOf(rat), 1);
    }
  }

  const matchups = matchMan(manDefenders);
  for (const d of manDefenders){
    const target = matchups[d.label] || null;
    d.assignment.covers = target;
    if (!target){
      // More coverage players than receivers. Python turns the odd man into a
      // rat in the hole, or a rusher when the call is already a pressure.
      d.assignment = meta.pressure
        ? {role:"blitz", zone:null, side:1, covers:null, gap:"A", path:[], note:null}
        : {role:"robot", zone:"hole", side:0, covers:null, gap:null, path:[], note:null};
    }
  }
  play.defense.coverage = meta.coverage || null;
  play.defense.pressure = meta.pressure || null;
  renderAll();
  toast(meta.coverage || name.replace(/_/g, " "));
}

function applyScheme(name, direction){
  const scheme = CATALOG.schemes[name] && CATALOG.schemes[name][String(direction)];
  if (!scheme) return;
  pushUndo();
  for (const [label, block] of Object.entries(scheme)){
    const a = findA(label);
    if (!a) continue;                     // not on the field in this formation
    a.block = clone(block);
    a.route = null;
  }
  if (CATALOG.protections.includes(name) && !play.protection)
    play.protection = name.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  renderAll();
  toast(`${name.replace(/_/g," ")} ${direction > 0 ? "right" : "left"}`);
}

function flipPlay(){
  pushUndo();
  play.assignments.forEach(a => {
    a.player.x = -a.player.x;
    if (a.motion_from) a.motion_from = [-a.motion_from[0], a.motion_from[1]];
  });
  if (play.defense) play.defense.players.forEach(d => d.x = -d.x);
  const swap = s => s && s.replace(/Right|Left|\bRt\b|\bLt\b/g,
      m => ({Right:"Left",Left:"Right",Rt:"Lt",Lt:"Rt"}[m]));
  play.formation.name = swap(play.formation.name);
  play.name = swap(play.name);
  syncFormation(); renderAll();
}

/* ─── SVG drawing (mirrors svg.py) ──────────────────────────────────────── */
function el(tag, attrs, text){
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined)
    n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
}
function txt(g, x, y, text, fill, size, weight, anchor, opacity){
  g.appendChild(el("text", {x:x.toFixed(1), y:y.toFixed(1), "text-anchor":anchor || null,
    fill, "font-family":FONT, "font-size":size, "font-weight":weight || null,
    opacity: opacity ?? null}, String(text)));
}

function smoothPath(pts){
  if (pts.length < 2) return "";
  if (pts.length === 2)
    return `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)} L ${pts[1][0].toFixed(1)},${pts[1][1].toFixed(1)}`;
  const out = [`M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`];
  const n = pts.length;
  for (let i = 0; i < n - 1; i++){
    const p0 = pts[Math.max(0, i-1)], p1 = pts[i], p2 = pts[i+1],
          p3 = pts[Math.min(n-1, i+2)];
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    out.push(`C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`);
  }
  return out.join(" ");
}

// Yards from the line of scrimmage to the opponent's goal, when known.
function spotYard(){
  const s = play.situation;
  return (s && s.yard_line != null) ? Math.round(+s.yard_line) : null;
}
const goalY = spotYard;
const mod5 = v => ((v % 5) + 5) % 5;
// Which yards carry the five-yard lines: the real grid once the ball is spotted.
function gridPhase(){ const s = spotYard(); return s === null ? 0 : mod5(s); }

function drawField(g){
  const t = T(), w = W(), h = H();
  const side = CATALOG.fields[level].width / 2;
  const [xLo, xHi] = X_RANGE, [yLo, yHi] = Y_RANGE;

  // The surface, with the mowing pattern on the five-yard grid
  const phase = gridPhase();
  g.appendChild(el("rect", {width:w, height:h, fill:t.field}));
  for (let yd = phase - 5; yd < yHi + 5; yd += 10){
    const y0 = sy(yd + 5), y1 = sy(yd);
    g.appendChild(el("rect", {x:0, y:Math.min(y0,y1), width:w,
      height:Math.abs(y1-y0), fill:t.field_alt}));
  }
  // The end zone, when the ball spot says it is in view
  const goal = goalY();
  if (goal !== null && goal > yLo && goal < yHi)
    g.appendChild(el("rect", {x:0, y:sy(yHi), width:w, height:sy(goal) - sy(yHi), fill:t.endzone}));
  // Out of bounds past the real sidelines
  if (xLo < -side) g.appendChild(el("rect", {x:0, y:0, width:sx(-side), height:h, fill:t.oob}));
  if (xHi > side)  g.appendChild(el("rect", {x:sx(side), y:0, width:w - sx(side), height:h, fill:t.oob}));

  // Yard lines between the sidelines; the line of scrimmage is solid ink
  const lx0 = sx(Math.max(xLo, -side)), lx1 = sx(Math.min(xHi, side));
  for (let yd = Math.ceil(yLo); yd <= yHi; yd++){
    if (yd !== 0 && mod5(yd) !== phase) continue;
    const y = sy(yd);
    if (yd === 0)
      g.appendChild(el("line", {x1:lx0, y1:y, x2:lx1, y2:y, stroke:t.los, "stroke-width":2.2}));
    else
      g.appendChild(el("line", {x1:lx0, y1:y, x2:lx1, y2:y, stroke:t.line, "stroke-width":1}));
  }
  if (goal !== null && goal > yLo && goal < yHi && goal !== 0)
    g.appendChild(el("line", {x1:lx0, y1:sy(goal), x2:lx1, y2:sy(goal), stroke:t.los, "stroke-width":2}));

  // Hash marks
  const hx = CATALOG.fields[level].hash_from_center;
  for (const h_ of [-hx, hx]){
    const px = sx(h_), tick = SCALE * 0.25;
    for (let yd = Math.ceil(yLo); yd <= yHi; yd++){
      const y = sy(yd);
      g.appendChild(el("line", {x1:px-tick, y1:y, x2:px+tick, y2:y,
        stroke:t.hash, "stroke-width":1.5}));
    }
  }
  // Sidelines
  for (const fx of [-side, side]){
    if (fx < xLo || fx > xHi) continue;
    g.appendChild(el("line", {x1:sx(fx), y1:sy(yHi), x2:sx(fx), y2:sy(yLo),
      stroke:t.sideline, "stroke-width":2}));
  }
  drawNumbers(g);

  // Ball spot on the hash this play is run from
  const hm = play.situation && play.situation.hash_mark;
  if (hm){
    const bx = sx(hm === "L" ? -hx : hm === "R" ? hx : 0), by = sy(0);
    g.appendChild(el("ellipse", {cx:bx, cy:by, rx:SCALE*0.3, ry:SCALE*0.18,
      fill:t.ball, stroke:t.los, "stroke-width":1}));
  }
}

// Yard numbers on the tens, once the ball spot pins the field down.
function drawNumbers(g){
  const s = play.situation;
  if (!s || s.yard_line == null) return;
  const t = T(), fs = SCALE * 0.95;
  const f = CATALOG.fields[level];
  const nx = f.width / 2 - f.numbers_from_sideline;
  const spot = spotYard();
  for (let yd = Math.ceil(Y_RANGE[0]); yd <= Y_RANGE[1]; yd++){
    const toGoal = spot - yd;
    if (toGoal % 10 || !(toGoal > 0 && toGoal < 100)) continue;
    const label = String(toGoal <= 50 ? toGoal : 100 - toGoal);
    const y = sy(yd) + fs * 0.36;
    for (const fx of [-nx, nx]){
      if (fx <= X_RANGE[0] || fx >= X_RANGE[1]) continue;
      txt(g, sx(fx), y, label, t.number, Math.round(fs), 700, "middle");
    }
  }
}

function drawMotions(g){
  const t = T();
  for (const a of assignments()){
    if (!a.motion_from) continue;
    const [fx, fy] = a.motion_from;
    const s = [sx(fx), sy(fy)], e = [sx(a.player.x), sy(a.player.y)];
    const dx = e[0]-s[0], dy = e[1]-s[1];
    const dist = Math.hypot(dx, dy) || 1, gap = SCALE * 0.55;
    const ex = e[0] - dx/dist*gap, ey = e[1] - dy/dist*gap;
    const mx = (s[0]+ex)/2, my = (s[1]+ey)/2 - SCALE*0.55;
    g.appendChild(el("path", {
      d:`M ${s[0].toFixed(1)} ${s[1].toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`,
      fill:"none", stroke:t.motion, "stroke-width":1.8,
      "stroke-dasharray":"5,4", "stroke-linecap":"round",
      "marker-end":"url(#arr-motion)", opacity:0.9}));
    const r = SCALE * 0.42;
    g.appendChild(el("circle", {cx:s[0], cy:s[1], r:r, fill:"none",
      stroke:t.motion, "stroke-width":1.4, "stroke-dasharray":"3,3", opacity:0.75}));
    if (a.motion_type)
      txt(g, s[0], s[1]-r-4, a.motion_type.toUpperCase(), t.motion, 9, 700, "middle", 0.9);
  }
}

function trimStart(pts, amount){
  if (pts.length < 2 || amount <= 0) return pts;
  const [x0,y0] = pts[0], [x1,y1] = pts[1];
  const dx = x1-x0, dy = y1-y0, len = Math.hypot(dx,dy);
  if (len <= amount) return pts;
  return [[x0 + dx/len*amount, y0 + dy/len*amount], ...pts.slice(1)];
}

function blockCap(g, pts, isCut){
  const [x0,y0] = pts[pts.length-2], [x1,y1] = pts[pts.length-1];
  const dx = x1-x0, dy = y1-y0, len = Math.hypot(dx,dy) || 1;
  const nx = -dy/len, ny = dx/len, half = SCALE*0.42;
  const stroke = T().block;
  if (isCut){
    const ux = dx/len*half, uy = dy/len*half;
    g.appendChild(el("line", {x1:x1-ux-nx*half, y1:y1-uy-ny*half,
      x2:x1+ux+nx*half, y2:y1+uy+ny*half, stroke,
      "stroke-width":2.4, "stroke-linecap":"round", opacity:0.9}));
  } else {
    g.appendChild(el("line", {x1:x1-nx*half, y1:y1-ny*half,
      x2:x1+nx*half, y2:y1+ny*half, stroke,
      "stroke-width":2.4, "stroke-linecap":"round", opacity:0.9}));
  }
}

// Block paths are relative to the blocker and, unlike routes, never mirrored.
function blockAbs(p, blk){
  return blk.path.map(w => [sx(p.x + w.x), sy(p.y + w.y)]);
}

function drawBlocks(g){
  const t = T();
  const combos = new Set();
  for (const a of assignments()){
    let blk = a.block;
    if (!blk){
      if (a.route && a.route.route_type === "block") blk = CATALOG.blocks.BASE["1"];
      else continue;
    }
    const pts = blockAbs(a.player, blk);
    if (pts.length < 2) continue;
    const trimmed = trimStart(pts, SCALE*0.42);
    g.appendChild(el("path", {d:smoothPath(trimmed), fill:"none",
      stroke:t.block, "stroke-width":2.4, "stroke-linecap":"round",
      "stroke-linejoin":"round", opacity:0.9}));
    blockCap(g, trimmed, blk.kind === "cut");

    if (blk.combo_with){
      const key = [a.player.label, blk.combo_with].sort().join("|");
      const partner = findA(blk.combo_with);
      if (partner && !combos.has(key)){
        combos.add(key);
        const x1 = sx(a.player.x), y1 = sy(a.player.y);
        const x2 = sx(partner.player.x), y2 = sy(partner.player.y);
        const my = Math.max(y1,y2) + SCALE*0.75;
        g.appendChild(el("path", {
          d:`M ${x1.toFixed(1)} ${(y1+SCALE*0.5).toFixed(1)} Q ${((x1+x2)/2).toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${(y2+SCALE*0.5).toFixed(1)}`,
          fill:"none", stroke:t.block, "stroke-width":1.4,
          "stroke-dasharray":"4,3", opacity:0.65}));
      }
    }
  }
}

function qbAssignment(){
  return assignments().find(a => a.qb);
}

function drawQB(g){
  const t = T();
  for (const a of assignments()){
    const plan = a.qb;
    if (!plan || !plan.path || plan.path.length < 2) continue;
    const pts = trimStart(plan.path.map(p => [sx(a.player.x + p.x), sy(a.player.y + p.y)]),
                          SCALE*0.5);
    g.appendChild(el("path", {d:smoothPath(pts), fill:"none", stroke:t.qb,
      "stroke-width":2.2, "stroke-linecap":"round", "stroke-linejoin":"round",
      "marker-end":"url(#arr-qb)", opacity:0.95}));
    if (plan.mesh_at){
      g.appendChild(el("circle", {cx:sx(a.player.x + plan.mesh_at.x),
        cy:sy(a.player.y + plan.mesh_at.y), r:SCALE*0.28, fill:"none",
        stroke:t.qb, "stroke-width":1.8, opacity:0.95}));
    }
  }
}

function drawReads(g){
  const plan = (qbAssignment() || {}).qb;
  if (!plan || !plan.reads || !plan.reads.length) return;
  const t = T();
  for (const a of assignments()){
    const order = plan.reads.indexOf(a.player.label);
    if (order < 0 || !a.route) continue;
    const pts = a.route.waypoints.map(w => wpAbs(a.player, w));
    if (pts.length < 2) continue;
    const [px, py] = pts[pts.length-2], [ex, ey] = pts[pts.length-1];
    const dx = ex-px, dy = ey-py, len = Math.hypot(dx, dy) || 1;
    const cx = sx(ex - dy/len*1.3), cy = sy(ey + dx/len*1.3);
    const r = Math.max(6, SCALE*0.36);
    g.appendChild(el("circle", {cx, cy, r, fill:t.read_fill, stroke:t.qb,
      "stroke-width":1.4, opacity:0.95}));
    txt(g, cx, cy + r*0.36, order+1, t.read_text, Math.round(r*1.05), 700, "middle");
  }
}

function drawRoutes(g){
  const t = T();
  for (const a of assignments()){
    if (!a.route) continue;
    const rt = a.route.route_type;
    if (rt === "block") continue;
    const pts = a.route.waypoints.map(w => {
      const [ax, ay] = wpAbs(a.player, w);
      return [sx(ax), sy(ay)];
    });
    const runner = a.is_ball_carrier || rt === "run";
    g.appendChild(el("path", {d:smoothPath(pts), fill:"none",
      stroke: runner ? t.run : t.route,
      "stroke-width": runner ? 2.8 : 2.4,
      "stroke-linecap":"round", "stroke-linejoin":"round",
      "marker-end": runner ? "url(#arr-run)" : "url(#arr-route)",
      opacity:0.94}));
  }
}

// Rush and blitz paths are formulas, mirrored from templates/coverages.py.
function defPath(call, d){
  if (call.path && call.path.length) return call.path.map(p => [p.x, p.y]);
  switch (call.role){
    case "rush":    { const l = -0.18*d.x; return [[0,0],[l*0.4,-1.6],[l,-3.6]]; }
    case "contain": { const s = d.x >= 0 ? 1 : -1;
                      return [[0,0],[s*1.4,-1.2],[s*1.9,-3.6]]; }
    case "blitz":   { const l = -0.3*d.x;
                      return [[0,0],[l*0.35,-d.y*0.5],[l,-d.y-3.0]]; }
    case "spy":     return [[0,0],[0,-2.0]];
    default:        return [];
  }
}

function ballX(){
  const hm = play.situation && play.situation.hash_mark;
  if (!hm || hm === "M") return 0;
  const hx = CATALOG.fields[level].hash_from_center;
  return hm === "L" ? -hx : hx;
}

function zoneLandmark(call){
  const z = CATALOG.zones[call.zone];
  if (!z) return null;
  const limit = CATALOG.fields[level].width / 2 - 1;
  const x = Math.max(-limit, Math.min(limit, ballX() + call.side * z.base_x));
  return [x, z.depth];
}

function defArrow(g, from, to, dashed, maxYards, minYards){
  let [sx, sy] = [sx0(from), sy0(from)];
  let ex = sx0(to), ey = sy0(to);
  let dx = ex - sx, dy = ey - sy;
  let dist = Math.hypot(dx, dy);
  if (dist < 1e-6){ dx = 0; dy = -SCALE; dist = SCALE; }
  const ux = dx/dist, uy = dy/dist;
  if (maxYards) dist = Math.min(dist, maxYards*SCALE);
  const trim = SCALE*0.5;
  const visible = Math.max(dist - 2*trim, (minYards||0)*SCALE);
  sx += ux*trim; sy += uy*trim;
  ex = sx + ux*visible; ey = sy + uy*visible;
  g.appendChild(el("line", {x1:sx, y1:sy, x2:ex, y2:ey, stroke:T().def_assign,
    "stroke-width":2, "stroke-dasharray": dashed ? "7,5" : null,
    "marker-end":"url(#arr-def)", opacity:0.85}));
}
const sx0 = p => sx(p[0]);
const sy0 = p => sy(p[1]);

function drawDefenseAssignments(g){
  if (!play.defense) return;
  const t = T();
  const offense = {};
  assignments().forEach(a => offense[a.player.label] = a.player);

  for (const d of play.defense.players){
    const call = d.assignment;
    if (!call) continue;

    if (call.zone){
      const spot = zoneLandmark(call);
      if (!spot) continue;
      const z = CATALOG.zones[call.zone];
      if (layers.zones) g.appendChild(el("ellipse", {cx:sx(spot[0]), cy:sy(spot[1]),
        rx:z.half_w*SCALE*ZONE_SCALE, ry:z.half_h*SCALE*ZONE_SCALE,
        fill:t.zone_fill, stroke:t.zone_stroke, "stroke-width":1}));
      if (layers.coverage) defArrow(g, [d.x, d.y], spot, true, 6.0, 0);
    } else if (call.role === "man" && offense[call.covers]){
      const tg = offense[call.covers];
      if (layers.coverage) defArrow(g, [d.x, d.y], [tg.x, tg.y], false, null, 2.2);
    } else {
      if (!layers.coverage) continue;
      const rel = defPath(call, d);
      if (rel.length < 2) continue;
      const pts = trimStart(rel.map(p => [sx(d.x + p[0]), sy(d.y + p[1])]),
                            SCALE*0.5);
      g.appendChild(el("path", {d:smoothPath(pts), fill:"none",
        stroke:t.def_assign, "stroke-width":2.2, "stroke-linecap":"round",
        "marker-end":"url(#arr-def)", opacity:0.9}));
    }
  }
}

function drawDefense(g){

function renderSvg(){
  const svg = el("svg", {xmlns:"http://www.w3.org/2000/svg",
    width:W(), height:H(), viewBox:`0 0 ${W()} ${H()}`});
  svg.appendChild(defs());
  const art = el("g", {id:"art"});
  drawField(art);
  if (layers.motion) drawMotions(art);
  if (layers.blocks) drawBlocks(art);
  if (layers.qb) drawQB(art);
  if (layers.routes) drawRoutes(art);
  if (layers.reads) drawReads(art);
  if (layers.defense){ drawDefenseAssignments(art); drawDefense(art); }
  drawPlayers(art);
  if (layers.title) drawTitle(art);
  svg.appendChild(art);
  const ui = el("g", {id:"ui"});
  drawUI(ui);
  svg.appendChild(ui);
  return svg;

/* ─── pointer interaction ───────────────────────────────────────────────── */
function stagePoint(evt, svg){
  const r = svg.getBoundingClientRect();
  return [ix(evt.clientX - r.left), iy(evt.clientY - r.top)];
}

function bindStage(svg){
  svg.addEventListener("pointerdown", evt => {
    const t = evt.target;
    const [fx, fy] = stagePoint(evt, svg);
    if (t.dataset && t.dataset.player !== undefined){
      sel = t.dataset.player; selDef = null; selWp = -1;
      pushUndo();
      drag = {kind:"player", label:sel};
      svg.setPointerCapture(evt.pointerId);
      renderAll(); return;
    }
    if (t.dataset && t.dataset.motion !== undefined){
      sel = t.dataset.motion; pushUndo();
      drag = {kind:"motion", label:sel};
      svg.setPointerCapture(evt.pointerId);
      renderAll(); return;
    }
    if (t.dataset && t.dataset.defender !== undefined){
      selDef = t.dataset.defender; sel = null; selWp = -1;
      pushUndo();
      drag = {kind:"defender", label:selDef};
      svg.setPointerCapture(evt.pointerId);
      renderAll(); return;
    }
    if (t.dataset && t.dataset.wp !== undefined){
      selWp = +t.dataset.wp; pushUndo();
      drag = {kind:"waypoint", index:selWp};
      svg.setPointerCapture(evt.pointerId);
      renderAll(); return;
    }
    // empty field: extend the selected player's route
    const a = selA();
    if (a){
      pushUndo();
      if (!a.route || a.route.route_type === "block"){
        a.route = {route_type:"custom", waypoints:[{x:0, y:0}], depth:null};
        a.block = null;
      }
      a.route.waypoints.push(wpRel(a.player, snap(fx), snap(fy)));
      a.route.route_type = "custom";
      selWp = a.route.waypoints.length - 1;
      renderAll();
    } else {
      sel = null; selWp = -1; renderAll();
    }
  });

  svg.addEventListener("pointermove", evt => {
    if (!drag) return;
    const [fx, fy] = stagePoint(evt, svg);
    const a = findA(drag.kind === "waypoint" ? sel : drag.label);
    if (!a) return;
    if (drag.kind === "defender"){
      const d = play.defense && play.defense.players.find(p => p.label === drag.label);
      if (d){ d.x = snap(fx); d.y = snap(fy); }
      renderStage(); renderInspector(); return;
    }
    if (drag.kind === "player"){
      a.player.x = snap(fx); a.player.y = snap(fy);
      syncFormation();
    } else if (drag.kind === "motion"){
      a.motion_from = [snap(fx), snap(fy)];
    } else {
      a.route.waypoints[drag.index] = wpRel(a.player, snap(fx), snap(fy));
      a.route.route_type = "custom";
    }
    renderStage(); renderInspector();
  });

  const end = () => { if (drag){ drag = null; renderAll(); } };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);

  svg.addEventListener("dblclick", evt => {
    const t = evt.target;
    if (t.dataset && t.dataset.defender !== undefined){
      selDef = t.dataset.defender; sel = null; selWp = -1;
      pushUndo();
      drag = {kind:"defender", label:selDef};
      svg.setPointerCapture(evt.pointerId);
      renderAll(); return;
    }
    if (t.dataset && t.dataset.wp !== undefined){
      const a = selA(); if (!a || !a.route) return;
      pushUndo();
      a.route.waypoints.splice(+t.dataset.wp, 1);
      if (a.route.waypoints.length < 2) a.route = null;
      selWp = -1; renderAll();
    }
  });
}

/* ─── panels ────────────────────────────────────────────────────────────── */
function option(value, label, selected){
  const o = document.createElement("option");
  o.value = value; o.textContent = label; o.selected = !!selected;
  return o;
}

function fillSelect(node, entries, current, placeholder){
  node.innerHTML = "";
  if (placeholder) node.appendChild(option("", placeholder, !current));
  for (const [value, label] of entries)
    node.appendChild(option(value, label, value === current));
}

// A segmented control: [[value, label, title?], ...]. One raised segment.
function segment(node, entries, current, onPick){
  node.innerHTML = "";
  for (const [value, label, title] of entries){
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.dataset.value = value;
    if (title) b.title = title;
    b.classList.toggle("on", value === current);
    b.onclick = () => onPick(value);
    node.appendChild(b);
  }
}
function setSeg(node, current){
  for (const b of node.children) b.classList.toggle("on", b.dataset.value === String(current));
}
function pick(cls, html, onclick, title){
  const b = document.createElement("button");
  b.type = "button"; b.className = cls; b.innerHTML = html; b.onclick = onclick;
  if (title) b.title = title;
  return b;
}

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const words = s => String(s ?? "").replace(/_/g, " ");

function playerKind(p){
  if (OL.has(p.position)) return "lineman";
  if (p.position === "QB") return "quarterback";
  if (["RB","HB","FB","TB","H"].includes(p.position)) return "back";
  return "receiver";
}

function assignmentSummary(a){
  if (a.qb && a.qb.action) return words(a.qb.action);
  if (a.route && a.route.route_type !== "block") return words(a.route.route_type);
  if (a.block) return (a.block.kind && a.block.kind !== "base" ? words(a.block.kind) : "block")
                    + (a.block.target ? " " + a.block.target : "");
  if (a.route && a.route.route_type === "block") return "block";
  return "—";
}

function defenderSummary(d){
  const c = d.assignment;
  if (!c) return "—";
  if (c.zone) return (CATALOG.zones[c.zone] || {}).name || words(c.zone);
  if (c.role === "man") return "man " + (c.covers || "");
  return words(c.role) + (c.gap ? " " + c.gap : "");
}

function blockOl(){
  pushUndo();
  assignments().forEach(a => {
    if (OL.has(a.player.position) && !a.route && !a.block)
      a.block = clone(CATALOG.blocks.BASE["1"]);
  });
  renderAll(); toast("Line blocked");
}

function setDefense(key){
  pushUndo();
  if (!key) play.defense = null;
  else { play.defense = clone(CATALOG.defenses[key]); play.defense._key = key; }
  selDef = null; renderAll();
  toast(key ? CATALOG.defenses[key].name : "Defense removed");
}
function defenseKey(){
  if (!play.defense) return null;
  return play.defense._key || Object.keys(CATALOG.defenses).find(
    k => CATALOG.defenses[k].name === play.defense.name) || null;
}
function coverageKey(){
  const calls = play.defense && CATALOG.coverage_calls[play.defense.name];
  if (!calls) return null;
  return Object.keys(calls).find(k => {
    const m = calls[k].__meta__ || {};
    return (m.coverage || null) === (play.defense.coverage || null)
        && (m.pressure || null) === (play.defense.pressure || null);
  }) || null;
}

// A tiny dot-diagram of a formation or a look, drawn in the current colour.
function thumbSvg(points, kind){
  const W = 96, H = 40, off = kind === "off";
  const px = x => (x + 29) / 58 * W;
  const py = off ? y => H - 6 - ((y + 8) / 9.5) * (H - 12)
                 : y => H - 6 - (y / 14) * (H - 12);
  const los = py(0).toFixed(1);
  const shapes = points.map(p => off
    ? `<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="2.2"/>`
    : `<rect x="${(px(p.x) - 2).toFixed(1)}" y="${(py(p.y) - 2).toFixed(1)}" width="4" height="4" rx="0.8"/>`
  ).join("");
  return `<svg class="thumb" viewBox="0 0 ${W} ${H}" aria-hidden="true">`
       + `<line class="los" x1="0" y1="${los}" x2="${W}" y2="${los}"/>${shapes}</svg>`;
}

/* ─── tool popovers ─────────────────────────────────────────────────────── */
let pop = null, popFresh = false, lastScheme = null, libQuery = "";

function openPop(kind){ popFresh = pop !== kind; pop = pop === kind ? null : kind; renderPop(); }
function closePop(){ if (pop){ pop = null; renderPop(); } }

function renderPop(){
  const box = $("pop");
  for (const b of $("rail").querySelectorAll("button")){
    b.classList.toggle("on", b.dataset.pop === pop);
    if (b.dataset.pop === "layers")
      b.classList.toggle("dim", LAYER_KEYS.some(k => !layers[k]));
  }
  if (!pop){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  ({formation: popFormation, line: popLine, defense: popDefense,
    library: popLibrary, layers: popLayers})[pop](box);
  popFresh = false;
}

function popFormation(box){
  const keys = Object.keys(CATALOG.formations);
  const cur = keys.find(k => CATALOG.formations[k].name === play.formation.name);
  box.innerHTML = `<div class="pop-head"><h2>Formation <span class="sub">${keys.length}</span></h2></div>
    <div class="pop-body"><div class="cards" id="fmCards"></div></div>`;
  const grid = $("fmCards");
  for (const k of keys){
    const f = CATALOG.formations[k];
    grid.appendChild(pick("card-pick" + (k === cur ? " on" : ""),
      thumbSvg(f.players, "off")
        + `<span class="nm">${esc(f.name)}</span><span class="pers">${esc(f.personnel)} personnel</span>`,
      () => { setFormation(k); closePop(); toast(f.name); }, f.description || f.name));
  }
}

function popLine(box){
  box.innerHTML = `<div class="pop-head"><h2>Line scheme</h2></div><div class="pop-body">
    <div class="seg full" id="schemeDir" role="group" aria-label="Scheme direction"></div>
    <div class="list" id="schemeList" style="margin-top:8px"></div>
    <button id="btnBlockOl" class="wide" title="Give every unassigned lineman a base block">Base block the whole line</button>
    <p class="note">A scheme sets the whole line at once. Pick a lineman on the bench
      to change one block.</p></div>`;
  segment($("schemeDir"), [["-1","← Left"],["1","Right →"]], String(blockDir), v => {
    blockDir = +v; setSeg($("schemeDir"), v);
    if (lastScheme) applyScheme(lastScheme, blockDir);
  });
  const list = $("schemeList");
  for (const k of Object.keys(CATALOG.schemes)){
    const prot = CATALOG.protections.includes(k);
    list.appendChild(pick("row-pick" + (k === lastScheme ? " on" : ""),
      `<span class="nm">${esc(words(k))}</span><span class="tag">${prot ? "protection" : "run"}</span>`,
      () => { lastScheme = k; applyScheme(k, blockDir); }));
  }
  $("btnBlockOl").onclick = blockOl;
}

function popDefense(box){
  const cur = defenseKey(), cov = coverageKey();
  box.innerHTML = `<div class="pop-head"><h2>Defense</h2></div><div class="pop-body">
    <h3 class="first">Look</h3><div class="cards" id="dfCards"></div>
    <h3>Coverage</h3><div class="list two" id="cvList"></div>
    <p class="note">${play.defense
      ? "Zone drops come from the call. Man match-ups are worked out against the receivers on the field."
      : "Pick a look first, then a coverage."}</p></div>`;
  const grid = $("dfCards");
  grid.appendChild(pick("card-pick none" + (!play.defense ? " on" : ""),
    `<span class="nm">No defense</span>`, () => setDefense(null)));
  for (const [k, d] of Object.entries(CATALOG.defenses)){
    grid.appendChild(pick("card-pick" + (k === cur ? " on" : ""),
      thumbSvg(d.players, "def")
        + `<span class="nm">${esc(d.name)}</span><span class="pers">${esc(d.coverage || d.front || "")}</span>`,
      () => setDefense(k), d.description || d.name));
  }
  const list = $("cvList");
  for (const k of CATALOG.coverages){
    const b = pick("row-pick" + (k === cov ? " on" : ""),
      `<span class="nm">${esc(words(k))}</span>`, () => applyCoverage(k));
    b.disabled = !play.defense;
    list.appendChild(b);

function popLibrary(box){
  const n = Object.keys(CATALOG.plays).length;
  box.innerHTML = `<div class="pop-head"><h2>Library <span class="sub">${n} concepts</span></h2></div>
    <div class="pop-body">
    <input id="libSearch" placeholder="Search concepts" autocomplete="off" spellcheck="false" aria-label="Search concepts">
    <div class="list" id="libList"></div>
    <p class="note">Loading a concept replaces the current play. Undo brings the old one back.</p></div>`;
  const list = $("libList"), input = $("libSearch");
  const draw = () => {
    list.innerHTML = "";
    const q = libQuery.toLowerCase();
    let shown = 0;
    for (const v of Object.values(CATALOG.plays)){
      const hay = `${v.name} ${v.formation.name} ${v.play_type} ${(v.tags || []).join(" ")}`.toLowerCase();
      if (q && !hay.includes(q)) continue;
      shown++;
      list.appendChild(pick("row-pick" + (v.name === play.name ? " on" : ""),
        `<span class="nm">${esc(v.name)}</span><span class="meta">${esc(v.formation.name)} · ${esc(v.play_type)}</span>`,
        () => { loadPlay(clone(v)); closePop(); }, v.description || v.name));
    }
    if (!shown) list.innerHTML = `<p class="note" style="margin:4px 0 0">Nothing matches.</p>`;
  };
  input.value = libQuery;
  input.oninput = e => { libQuery = e.target.value.trim(); draw(); };
  draw();
  if (popFresh) input.focus();
}
