name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Smoke-test the CLI
        run: |
          chalk list series
          chalk demo --out /tmp/demo
      - name: Designer demo page is up to date
        run: |
          chalk design --out docs/index.html --no-open
          git diff --exit-code docs/index.html
