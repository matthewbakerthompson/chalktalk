name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Smoke-test the CLI
        run: |
          chalk list series
          chalk demo --out /tmp/demo

  # What a user gets from pip: build the wheel, install it somewhere clean, run it.
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/clean
          if [ -f /tmp/clean/Scripts/python.exe ]; then PY=/tmp/clean/Scripts/python.exe; else PY=/tmp/clean/bin/python; fi
          "$PY" -m pip install dist/*.whl
          cd /tmp
          "$PY" -m chalktalk --version
          "$PY" -m chalktalk
          "$PY" -m chalktalk demo --out /tmp/demo
          "$PY" -c "from chalktalk.designer.server import Session; import tempfile; assert 'chalktalk' in Session(tempfile.mkdtemp()).page()"
