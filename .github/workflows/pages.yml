name: site

# The browser designer moved to its own repo, frozen:
# https://matthewbakerthompson.github.io/chalktalk-designer/
# This address keeps a page that forwards there, and a service worker that
# retires the old offline copy for anyone who installed it here. It only
# deploys when those files change.

on:
  push:
    branches: [main]
    paths:
      - .github/pages-redirect/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
